<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b18" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="SkyCast weather dashboard with forecasts, analytics, maps, air quality, and alerts."
    />
    <meta name="application-name" content="SkyCast" />
    <meta name="author" content="SkyCast" />
    <meta name="robots" content="index,follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SkyCast" />
    <meta property="og:title" content="SkyCast — Weather Dashboard" />
    <meta
      property="og:description"
      content="Live weather, forecasts, analytics, maps, air quality, and alerts in one dashboard."
    />
    <meta property="og:image" content="/favicon.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SkyCast — Weather Dashboard" />
    <meta
      name="twitter:description"
      content="Live weather, forecasts, analytics, maps, air quality, and alerts in one dashboard."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>SkyCast — Weather Dashboard</title>
    <script>
      (function () {
        try {
          var key = "skycast-theme";
          var pref = localStorage.getItem(key) || "DARK";
          var resolved = "dark";
          if (pref === "LIGHT") resolved = "light";
          else if (pref === "SYSTEM") {
            resolved = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          var root = document.documentElement;
          root.classList.remove("dark", "light");
          root.classList.add(resolved);
          root.dataset.theme = resolved;
          root.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
